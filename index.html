<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Cost of Waiting</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="See how much money you are losing every second by doing nothing. A live counter that shows the real cost of waiting.">
<style>
    html, body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        height: 100%;
    }

    .container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
    }

    h1 {
        font-size: clamp(28px, 5vw, 56px);
        font-weight: 700;
        margin-bottom: 12px;
    }

    .subtitle {
        font-size: clamp(14px, 2.5vw, 18px);
        color: #aaa;
        max-width: 520px;
        margin-bottom: 32px;
    }

    .input-box {
        margin-bottom: 24px;
    }

    input {
        background: #111;
        border: 1px solid #333;
        color: #fff;
        padding: 14px 16px;
        font-size: 18px;
        width: 240px;
        text-align: center;
        border-radius: 6px;
        outline: none;
    }

    input::placeholder {
        color: #666;
    }

    button {
        margin-top: 16px;
        padding: 14px 28px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        background: #fff;
        color: #000;
    }

    button:hover {
        opacity: 0.9;
    }

    .counter {
        margin-top: 40px;
        font-size: clamp(32px, 7vw, 72px);
        font-weight: 800;
        letter-spacing: 1px;
    }

    .label {
        margin-top: 8px;
        font-size: 14px;
        color: #aaa;
    }

    .breakdown {
        margin-top: 32px;
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
        justify-content: center;
        color: #ccc;
        font-size: 14px;
    }

    .ad-top, .ad-bottom {
        width: 100%;
        text-align: center;
        padding: 10px 0;
        background: #0a0a0a;
        color: #444;
        font-size: 12px;
    }

    .ad-bottom {
        position: fixed;
        bottom: 0;
        left: 0;
    }
</style>
</head>
<body>

<div class="ad-top">
    <!-- AdSense Top Banner -->
    Your Ad Here
</div>

<div class="container">
    <h1>Every second you wait, you lose money.</h1>
    <div class="subtitle">
        Doing nothing feels free. It isn’t.  
        This counter shows the silent cost of waiting.
    </div>

    <div class="input-box">
        <input type="number" id="income" placeholder="Monthly income (USD)">
        <br>
        <button onclick="startCounter()">START</button>
    </div>

    <div class="counter" id="lost">$0</div>
    <div class="label">Money lost so far</div>

    <div class="breakdown">
        <div id="perHour">$0 / hour</div>
        <div id="perDay">$0 / day</div>
        <div id="perYear">$0 / year</div>
    </div>
</div>

<div class="ad-bottom">
    <!-- AdSense Sticky Banner -->
    Your Ad Here
</div>

<script>
let interval;
let lost = 0;
let lossPerSecond = 0;

function startCounter() {
    clearInterval(interval);

    const incomeInput = document.getElementById("income").value;
    const monthlyIncome = incomeInput && incomeInput > 0 ? incomeInput : 3000;

    const yearlyIncome = monthlyIncome * 12;
    const workingSeconds = 365 * 24 * 60 * 60;

    lossPerSecond = yearlyIncome / workingSeconds;
    lost = 0;

    document.getElementById("perHour").innerText =
        "$" + (lossPerSecond * 3600).toFixed(2) + " / hour";
    document.getElementById("perDay").innerText =
        "$" + (lossPerSecond * 86400).toFixed(2) + " / day";
    document.getElementById("perYear").innerText =
        "$" + yearlyIncome.toFixed(2) + " / year";

    interval = setInterval(() => {
        lost += lossPerSecond;
        document.getElementById("lost").innerText =
            "$" + lost.toFixed(2);
    }, 100);
}
</script>

</body>
</html>
