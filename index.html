<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Cost of Waiting Index</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #0b0b0b;
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        max-width: 900px;
        width: 90%;
        padding: 40px;
        background: linear-gradient(145deg, #111, #0a0a0a);
        border-radius: 16px;
        box-shadow: 0 0 60px rgba(0,0,0,0.8);
    }

    h1 {
        font-size: 2.4rem;
        margin-bottom: 10px;
        text-align: center;
    }

    p.subtitle {
        text-align: center;
        color: #aaa;
        margin-bottom: 40px;
        font-size: 1.1rem;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #ccc;
    }

    input, select {
        width: 100%;
        padding: 12px;
        font-size: 1rem;
        border-radius: 8px;
        border: none;
        outline: none;
    }

    button {
        width: 100%;
        padding: 16px;
        font-size: 1.1rem;
        border-radius: 10px;
        border: none;
        background: #e63946;
        color: white;
        cursor: pointer;
        margin-top: 20px;
    }

    button:hover {
        background: #ff4d5a;
    }

    .result {
        margin-top: 40px;
        padding: 30px;
        background: #141414;
        border-radius: 12px;
        display: none;
    }

    .result h2 {
        margin-top: 0;
        color: #ff6b6b;
    }

    .metric {
        font-size: 1.2rem;
        margin: 12px 0;
    }

    .highlight {
        font-size: 1.6rem;
        color: #ffd166;
        margin-top: 20px;
    }

    .footer {
        margin-top: 40px;
        text-align: center;
        color: #666;
        font-size: 0.9rem;
    }
</style>
</head>
<body>

<div class="container">
    <h1>The Cost of Waiting Index</h1>
    <p class="subtitle">
        Every year you delay action, time quietly takes value away from your future.
    </p>

    <div class="form-group">
        <label>Age</label>
        <input type="number" id="age" placeholder="e.g. 30">
    </div>

    <div class="form-group">
        <label>Country</label>
        <select id="country">
            <option value="1.02">USA / Developed Economy</option>
            <option value="1.04">Emerging Economy</option>
            <option value="1.06">High Inflation Economy</option>
        </select>
    </div>

    <div class="form-group">
        <label>Annual Income (USD)</label>
        <input type="number" id="income" placeholder="e.g. 50000">
    </div>

    <button onclick="calculate()">Calculate My Cost of Waiting</button>

    <div class="result" id="result">
        <h2>Your Cost of Waiting</h2>

        <div class="metric" id="year1"></div>
        <div class="metric" id="year5"></div>
        <div class="metric" id="year10"></div>

        <div class="highlight" id="index"></div>
    </div>

    <div class="footer">
        This is an educational estimate. The real cost is often higher.
    </div>
</div>

<script>
function calculate() {
    const age = parseInt(document.getElementById("age").value);
    const income = parseFloat(document.getElementById("income").value);
    const inflationFactor = parseFloat(document.getElementById("country").value);

    if (!age || !income) {
        alert("Please complete all fields.");
        return;
    }

    // Simple opportunity cost model
    const opportunityRate = 0.08; // 8% missed growth
    const realLossRate = inflationFactor * opportunityRate;

    const loss1 = income * realLossRate;
    const loss5 = loss1 * 5 * 1.2;
    const loss10 = loss1 * 10 * 1.5;

    const index = Math.round((loss10 / income) * 100);

    document.getElementById("year1").innerText =
        "Waiting 1 year costs you approximately $" + loss1.toFixed(0);

    document.getElementById("year5").innerText =
        "Waiting 5 years costs you approximately $" + loss5.toFixed(0);

    document.getElementById("year10").innerText =
        "Waiting 10 years costs you approximately $" + loss10.toFixed(0);

    document.getElementById("index").innerText =
        "Your Cost of Waiting Index: " + index + " / 100";

    document.getElementById("result").style.display = "block";
}
</script>

</body>
</html>
